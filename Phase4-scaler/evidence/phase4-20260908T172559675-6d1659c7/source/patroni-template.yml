# PATRONI_SCOPE overrides this fallback with the unique run prefix.
scope: phase4-isolated
namespace: /phase4/
name: PATRONI_NAME_PLACEHOLDER
restapi:
  listen: 0.0.0.0:8008
  connect_address: PATRONI_CONNECT_ADDRESS_PLACEHOLDER:8008
etcd3:
  hosts: PATRONI_ETCD_HOSTS_PLACEHOLDER
bootstrap:
  dcs:
    ttl: 30
    loop_wait: 5
    retry_timeout: 5
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: 'on'
        max_connections: 100
        max_wal_senders: 16
        max_replication_slots: 16
        shared_buffers: 64MB
        hot_standby_feedback: 'on'
        wal_log_hints: 'on'
        logging_collector: 'on'
        log_destination: 'csvlog,stderr'
        log_directory: pg_log
        log_filename: postgresql-%Y-%m-%d_%H%M%S.log
        log_rotation_age: 10min
        log_rotation_size: 20MB
        log_truncate_on_rotation: 'off'
        log_statement: all
        log_min_duration_statement: 0
        log_line_prefix: '%m [%p] db=%d user=%u app=%a client=%r session=%c tx=%x '
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - host replication PATRONI_REPL_USER_PLACEHOLDER 0.0.0.0/0 md5
    - host all all 0.0.0.0/0 md5
  users:
    APP_USER_PLACEHOLDER:
      password: APP_PASSWORD_PLACEHOLDER
      options:
        - createdb
postgresql:
  listen: 0.0.0.0:5432
  connect_address: PATRONI_PG_CONNECT_PLACEHOLDER:5432
  data_dir: /var/lib/postgresql/data/pgdata
  authentication:
    superuser:
      username: PATRONI_SU_USER_PLACEHOLDER
      password: PATRONI_SU_PASS_PLACEHOLDER
    replication:
      username: PATRONI_REPL_USER_PLACEHOLDER
      password: PATRONI_REPL_PASS_PLACEHOLDER
  parameters:
    unix_socket_directories: /var/run/postgresql
  create_replica_methods:
    - basebackup
  basebackup:
    checkpoint: fast
tags:
  nofailover: NOFAILOVER_PLACEHOLDER
  noloadbalance: false
  clonefrom: false
  nosync: false
