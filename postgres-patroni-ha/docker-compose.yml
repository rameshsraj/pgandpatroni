# ============================================================
# PostgreSQL + Patroni HA — Docker Compose
# ============================================================
# Versions pinned for compatibility:
#   PostgreSQL 16.4, Patroni 3.3.2, etcd 3.5.15, HAProxy 2.9
# ============================================================

services:

  # ---- etcd (Distributed Configuration Store) ----
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: etcd
    hostname: etcd
    environment:
      ETCD_NAME: etcd0
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd0=http://etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: patroni-etcd-cluster
      ETCD_INITIAL_CLUSTER_STATE: new
    volumes:
      - etcd-data:/etcd-data
    networks:
      - patroni-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- PostgreSQL Node 1 (Patroni managed) ----
  pg-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pg-node-1
    hostname: pg-node-1
    environment:
      PATRONI_NAME: pg-node-1
      PATRONI_SCOPE: pg-ha-cluster
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-node-1:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node-1:5432
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data/pgdata
      PATRONI_SUPERUSER_USERNAME: ${POSTGRES_SUPERUSER}
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      PATRONI_REPLICATION_USERNAME: ${POSTGRES_REPLICATION_USER}
      PATRONI_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_APP_DATABASE: ${POSTGRES_APP_DATABASE}
    volumes:
      - pg-node-1-data:/var/lib/postgresql/data
      - ./patroni/patroni-template.yml:/etc/patroni/patroni-template.yml:ro
      - ./patroni/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      - patroni-net
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---- PostgreSQL Node 2 (Patroni managed) ----
  pg-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pg-node-2
    hostname: pg-node-2
    environment:
      PATRONI_NAME: pg-node-2
      PATRONI_SCOPE: pg-ha-cluster
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-node-2:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node-2:5432
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data/pgdata
      PATRONI_SUPERUSER_USERNAME: ${POSTGRES_SUPERUSER}
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      PATRONI_REPLICATION_USERNAME: ${POSTGRES_REPLICATION_USER}
      PATRONI_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_APP_DATABASE: ${POSTGRES_APP_DATABASE}
    volumes:
      - pg-node-2-data:/var/lib/postgresql/data
      - ./patroni/patroni-template.yml:/etc/patroni/patroni-template.yml:ro
      - ./patroni/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      - patroni-net
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---- PostgreSQL Node 3 (Patroni managed) ----
  pg-node-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pg-node-3
    hostname: pg-node-3
    environment:
      PATRONI_NAME: pg-node-3
      PATRONI_SCOPE: pg-ha-cluster
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-node-3:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node-3:5432
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data/pgdata
      PATRONI_SUPERUSER_USERNAME: ${POSTGRES_SUPERUSER}
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      PATRONI_REPLICATION_USERNAME: ${POSTGRES_REPLICATION_USER}
      PATRONI_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_APP_DATABASE: ${POSTGRES_APP_DATABASE}
    volumes:
      - pg-node-3-data:/var/lib/postgresql/data
      - ./patroni/patroni-template.yml:/etc/patroni/patroni-template.yml:ro
      - ./patroni/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      - patroni-net
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---- HAProxy (Client entry point) ----
  haproxy:
    image: haproxy:2.9-alpine
    container_name: haproxy
    hostname: haproxy
    ports:
      - "5000:5000"   # Primary / read-write
      - "5001:5001"   # Replicas / read-only
      - "7000:7000"   # HAProxy stats UI
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - patroni-net
    depends_on:
      - pg-node-1
      - pg-node-2
      - pg-node-3
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  etcd-data:
  pg-node-1-data:
  pg-node-2-data:
  pg-node-3-data:

networks:
  patroni-net:
    driver: bridge
