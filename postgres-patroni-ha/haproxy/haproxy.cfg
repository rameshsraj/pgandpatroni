# ============================================================
# HAProxy Configuration — PostgreSQL + Patroni HA
# ============================================================
# HAProxy uses Patroni's REST API health endpoints to determine
# which PostgreSQL node is the current primary (leader) and
# which nodes are replicas.
#
# Patroni endpoints used:
#   GET /primary   — returns 200 if the node is the primary
#   GET /replica   — returns 200 if the node is a replica
#
# HAProxy does NOT simply check whether port 5432 is open.
# It checks the Patroni REST API to confirm the actual role.
# ============================================================

global
    maxconn 1000
    log stdout format raw local0
    # Local-only runtime API for the lab controller's connection drain.
    stats socket ipv4@127.0.0.1:9999 level admin

# Re-resolve container names after creation/recreation; missing elastic nodes
# must not prevent HAProxy startup. These are bounded, predeclared lab slots.
resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold nx 2s
    hold timeout 2s
    hold refused 2s
    hold obsolete 2s

defaults
    log     global
    mode    tcp
    retries 3
    timeout client  30s
    timeout connect 5s
    timeout server  30s
    timeout check   5s

# ---- Stats UI (http://localhost:7000) ----
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

# ---- Primary / Read-Write endpoint ----
# Clients connect here for all write operations.
# HAProxy routes to whichever node Patroni reports as primary.
listen pg-primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg-node-1 pg-node-1:5432 maxconn 100 check port 8008
    server pg-node-2 pg-node-2:5432 maxconn 100 check port 8008
    server pg-node-3 pg-node-3:5432 maxconn 100 check port 8008
    server pg-node-4 pg-node-4:5432 maxconn 100 check port 8008
    # Controller admits the elastic slot only after SQL/replication readiness.
    server pg-node-5 pg-node-5:5432 maxconn 100 check port 8008 disabled

# ---- Replica / Read-Only endpoint ----
# Clients connect here for read-only queries distributed across replicas.
listen pg-replicas
    bind *:5001
    balance roundrobin
    # Do not admit replicas more than 1 MiB behind the leader.
    option httpchk GET /replica?lag=1048576
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg-node-1 pg-node-1:5432 maxconn 100 check port 8008
    server pg-node-2 pg-node-2:5432 maxconn 100 check port 8008
    server pg-node-3 pg-node-3:5432 maxconn 100 check port 8008
    server pg-node-4 pg-node-4:5432 maxconn 100 check port 8008
    server pg-node-5 pg-node-5:5432 maxconn 100 check port 8008 disabled
