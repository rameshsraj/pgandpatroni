# ============================================================
# HAProxy Configuration — PostgreSQL + Patroni HA
# ============================================================
# HAProxy uses Patroni's REST API health endpoints to determine
# which PostgreSQL node is the current primary (leader) and
# which nodes are replicas.
#
# Patroni endpoints used:
#   GET /primary   — returns 200 if the node is the primary
#   GET /replica   — returns 200 if the node is a replica
#
# HAProxy does NOT simply check whether port 5432 is open.
# It checks the Patroni REST API to confirm the actual role.
# ============================================================

global
    maxconn 1000
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    retries 3
    timeout client  30s
    timeout connect 5s
    timeout server  30s
    timeout check   5s

# ---- Stats UI (http://localhost:7000) ----
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

# ---- Primary / Read-Write endpoint ----
# Clients connect here for all write operations.
# HAProxy routes to whichever node Patroni reports as primary.
listen pg-primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg-node-1 pg-node-1:5432 maxconn 100 check port 8008
    server pg-node-2 pg-node-2:5432 maxconn 100 check port 8008
    server pg-node-3 pg-node-3:5432 maxconn 100 check port 8008

# ---- Replica / Read-Only endpoint ----
# Clients connect here for read-only queries distributed across replicas.
listen pg-replicas
    bind *:5001
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg-node-1 pg-node-1:5432 maxconn 100 check port 8008
    server pg-node-2 pg-node-2:5432 maxconn 100 check port 8008
    server pg-node-3 pg-node-3:5432 maxconn 100 check port 8008
